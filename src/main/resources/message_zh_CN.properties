system_name=智慧油田感传控管理系统
sys_admin=管理员角色
sys_user=用户角色



#设置开发工具，当设置idea的时候会删除eclipse软件的配置，反之也是如此
kaifa=idea
#设置生成的文件中的作者
author=dyb1296
#设置生成的文件中的作者邮箱
email=dyb1296@qq.com
#设置是否启用密码md5加密
md5=0
#如果为1，那么生成的表中如果关联其他的外键，可以通过点击的方法直接查看数据
show=1
#是否有echarts统计图
echarts=1
#是否有导出数据的功能
export=1
#是否可以导入数据
import=0
#设置欢迎页面
welcome=1
#设置是否按照数据的插入时间来统计插入量
echartstime=0
#是否开启富文本编辑器
fuwenben=1
#代码导出的路径
exportpath=ssm_youtiansys/
#代码的项目英文名字
project_name=ssm_youtiansys
#当引用外键的时候在页面上做一个标记
waijianbiaozhu=1
front=0
